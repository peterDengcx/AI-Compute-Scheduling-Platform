<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>算力卡调度台 · GPU 自助申请与占用</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230b1220'/%3E%3Crect x='4' y='4' width='10' height='10' rx='2.5' fill='%235eead4'/%3E%3Crect x='18' y='4' width='10' height='10' rx='2.5' fill='%23818cf8'/%3E%3Crect x='4' y='18' width='10' height='10' rx='2.5' fill='%23818cf8'/%3E%3Crect x='18' y='18' width='10' height='10' rx='2.5' fill='%2334d399'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="styles.css?v=24">
</head>
<body>
  <div class="bg-glow" aria-hidden="true"></div>

  <header class="topbar">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 32 32" width="26" height="26">
          <defs>
            <linearGradient id="lg" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0" stop-color="#5eead4"/>
              <stop offset="1" stop-color="#818cf8"/>
            </linearGradient>
          </defs>
          <rect x="3" y="3" width="11" height="11" rx="3" fill="url(#lg)"/>
          <rect x="18" y="3" width="11" height="11" rx="3" fill="url(#lg)" opacity=".55"/>
          <rect x="3" y="18" width="11" height="11" rx="3" fill="url(#lg)" opacity=".55"/>
          <rect x="18" y="18" width="11" height="11" rx="3" fill="url(#lg)" opacity=".3"/>
        </svg>
      </span>
      <div class="brand-text">
        <h1>算力卡调度台</h1>
        <p>推理节点 · 多卡申请 · 提前预约 · 到点自动释放</p>
      </div>
    </div>
  </header>

  <main class="wrap">
    <section class="stats" id="stats" aria-label="资源概览"></section>

    <div class="layout">
      <section class="machines-section">
        <div class="section-head">
          <div>
            <h2>推理节点</h2>
            <span class="hint">左侧为 8 卡实时状态，右侧为当天 0:00–24:00 的预约时间轴；空档可直接占用，最多提前 48 小时预约</span>
          </div>
          <button class="primary-btn small" id="addNode" type="button">+ 新增节点</button>
        </div>
        <div class="machine-grid" id="machines"></div>
      </section>
    </div>
  </main>

  <div id="modalRoot"></div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="app.js?v=24"></script>
</body>
</html>
